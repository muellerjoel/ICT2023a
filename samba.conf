[global]
   workgroup = WORKGROUP
   server string = Samba Fileserver
   security = user
   map to guest = never

   # Logging (optional)
   log file = /var/log/samba/log.%m
   max log size = 1000

   # Windows-Kompatibilität / ACLs (empfohlen)
   vfs objects = acl_xattr
   map acl inherit = yes
   store dos attributes = yes

   # Rechtesetzung bei neuen Dateien/Ordnern (Baseline)
   create mask = 0640
   directory mask = 2750
   force directory mode = 2750

   # Optional: schnelleres Browsing
   ea support = yes

[FIRMA]
   comment = Firmenablage
   path = /srv/samba/firma
   browseable = yes
   read only = yes
   guest ok = no

   # Wer darf überhaupt verbinden?
   valid users = @chef @ict_leitung @ict_mitarbeiter

   # Chef darf überall schreiben
   write list = @chef

   # Saubere Vererbung/Default-Rechte für Unterordner
   inherit permissions = yes
   inherit acls = yes

[ICT]
   comment = ICT Ordner
   path = /srv/samba/firma/ICT
   browseable = yes
   read only = yes
   guest ok = no

   # Zugriff nur für ICT + Chef
   valid users = @chef @ict_leitung @ict_mitarbeiter

   # Schreibrechte im ICT-Ordner nur Chef + ICT-Leitung
   write list = @chef @ict_leitung

   inherit permissions = yes
   inherit acls = yes
